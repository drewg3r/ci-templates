name: Release
on:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    uses: ./.github/workflows/release-please.yaml

  move-major-tag:
    needs: release
    if: needs.release.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          MAJOR: v${{ needs.release.outputs.major }}
        run: |
          git tag -f "$MAJOR"
          git push -f origin "$MAJOR"
